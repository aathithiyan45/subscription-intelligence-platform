spring.application.name=subscription-intelligence-platform

# ==============================
# PostgreSQL
# ==============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# Flyway Database Migrations
# ==============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT
# ==============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ==============================
# Redis
# ==============================
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# ==============================
# Scheduled Jobs
# ==============================
app.cache.warming.cron=${CACHE_WARMING_CRON}
app.notification.renewal.cron=${NOTIFICATION_RENEWAL_CRON}
app.notification.renewal-window-days=${NOTIFICATION_RENEWAL_WINDOW_DAYS}

# ==============================
# Data Seeding
# ==============================
app.seed.enabled=${DATA_SEED_ENABLED:true}


# ==============================
# Local AI - Ollama
# ==============================
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:gemma3:1b}
app.ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:30}
