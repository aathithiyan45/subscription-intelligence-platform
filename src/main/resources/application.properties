spring.application.name=subscription-intelligence-platform

# ==============================
# PostgreSQL
# ==============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT
# ==============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ==============================
# Redis
# ==============================
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# ==============================
# Scheduled Jobs
# ==============================
app.cache.warming.cron=${CACHE_WARMING_CRON}
app.notification.renewal.cron=${NOTIFICATION_RENEWAL_CRON}
app.notification.renewal-window-days=${NOTIFICATION_RENEWAL_WINDOW_DAYS}